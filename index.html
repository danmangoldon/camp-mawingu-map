<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#f3f3f3">
  <title>Camp Mawingu Location</title>

  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css"
    rel="stylesheet"
  >

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f1f1f1;
      font-family: Arial, Helvetica, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .mapboxgl-canvas {
      outline: none;
    }

    .mapboxgl-ctrl-group {
      overflow: hidden;
      border: 1px solid #dddddd;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.12);
    }

    .mapboxgl-ctrl button {
      width: 42px;
      height: 42px;
    }

    .camp-marker {
      position: relative;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 4px solid #ffffff;
      border-radius: 50%;
      background: #009b72;
      box-shadow: 0 2px 9px rgba(0, 0, 0, 0.30);
      cursor: pointer;
    }

    .camp-marker::after {
      position: absolute;
      inset: -9px;
      border: 1px solid rgba(0, 155, 114, 0.42);
      border-radius: 50%;
      content: "";
      animation: pulse 2.5s ease-out infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 0.85;
        transform: scale(0.55);
      }
      85%,
      100% {
        opacity: 0;
        transform: scale(1.6);
      }
    }

    .mapboxgl-popup-content {
      min-width: 205px;
      padding: 17px 18px;
      border: 1px solid #e3e3e3;
      border-radius: 14px;
      color: #111111;
      background: #ffffff;
      box-shadow: 0 9px 32px rgba(0, 0, 0, 0.18);
    }

    .mapboxgl-popup-close-button {
      top: 4px;
      right: 6px;
      width: 28px;
      height: 28px;
      color: #666666;
      font-size: 20px;
    }

    .popup-title {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 750;
      line-height: 1.15;
    }

    .popup-location {
      margin: 0 0 14px;
      color: #4d4d4d;
      font-size: 14px;
    }

    .popup-link {
      color: #111111;
      font-size: 14px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .camp-marker::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="map" aria-label="Interactive map showing Camp Mawingu in Ngong, Kenya"></div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.js"></script>
  <script>
    mapboxgl.accessToken = "pk.eyJ1IjoiZG1hbmdvbGQiLCJhIjoiY21zMjFybm91MGFrbzJ3c2ExeWc0MmFicyJ9.VwA1NgRTj7U_dGfezWZdeA";

    const campCoordinates = [36.67102154233, -1.3668933792826428];
    const googleMapsUrl =
      "https://www.google.com/maps?q=-1.3668933792826428,36.67102154233";

    const reduceMotion =
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/mapbox/light-v11",
      center: [20, 8],
      zoom: 2.1,
      pitch: 0,
      bearing: 0,
      attributionControl: true,
      antialias: true
    });

    map.addControl(
      new mapboxgl.NavigationControl({
        showCompass: false,
        showZoom: true
      }),
      "top-right"
    );

    const popup = new mapboxgl.Popup({
      offset: 20,
      closeButton: true,
      closeOnClick: false
    }).setHTML(`
      <h2 class="popup-title">Camp Mawingu</h2>
      <p class="popup-location">Ngong, Kenya</p>
      <a
        class="popup-link"
        href="${googleMapsUrl}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open in Google Maps →
      </a>
    `);

    const markerElement = document.createElement("button");
    markerElement.className = "camp-marker";
    markerElement.type = "button";
    markerElement.setAttribute("aria-label", "Open Camp Mawingu location details");

    new mapboxgl.Marker({
      element: markerElement,
      anchor: "center"
    })
      .setLngLat(campCoordinates)
      .setPopup(popup)
      .addTo(map);

    map.on("load", () => {
      if (reduceMotion) {
        map.jumpTo({
          center: campCoordinates,
          zoom: 12.7
        });
        popup.setLngLat(campCoordinates).addTo(map);
        return;
      }

      map.flyTo({
        center: [37.5, 0.5],
        zoom: 5.2,
        duration: 2800,
        curve: 1.25,
        essential: true
      });

      window.setTimeout(() => {
        map.flyTo({
          center: campCoordinates,
          zoom: 12.7,
          duration: 3900,
          curve: 1.3,
          speed: 0.75,
          essential: true
        });
      }, 2900);

      window.setTimeout(() => {
        popup.setLngLat(campCoordinates).addTo(map);
      }, 7000);
    });

    markerElement.addEventListener("click", () => {
      map.easeTo({
        center: campCoordinates,
        zoom: Math.max(map.getZoom(), 13.7),
        duration: reduceMotion ? 0 : 1200
      });
    });
  </script>
</body>
</html>
